[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavepilot-ofdm"
version = "0.1.0"
description = "Adaptive acoustic OFDM modem with synchronization, FEC and explainable link adaptation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jimmy-Xi" }]
dependencies = ["numpy>=2.0"]
keywords = ["ofdm", "digital-communications", "dsp", "modem", "acoustic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
]

[project.scripts]
wavepilot = "wavepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

